#
# Compila la imagen Docker de producción de este fork (chatwoot-capitalplus)
# en GitHub Actions y la publica en GitHub Container Registry (ghcr.io).
#
# Reemplaza el build en el servidor de producción (Hetzner, 4GB RAM), que
# sufría OOM-kill al compilar assets con los servicios ya corriendo.
#
name: Build & Publish Production Image

# Solo publica si "Run Chatwoot CE spec" paso sobre el mismo commit de main.
# Antes disparaba directo por push, sin depender de que los tests pasaran.
on:
  workflow_run:
    workflows: ["Run Chatwoot CE spec"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set lowercase image name
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set short SHA tag
        id: sha
        run: |
          FULL_SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "short=${FULL_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:latest
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
