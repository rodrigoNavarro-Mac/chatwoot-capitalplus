version: '3.8'

x-app: &app
  build:
    context: ..
    dockerfile: docker/Dockerfile
  image: chatwoot-capitalplus:latest
  env_file: .env.production
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started

services:
  rails:
    <<: *app
    command: >
      sh -c "
        bundle exec rails db:chatwoot_prepare &&
        bundle exec rails ip_lookup:setup &&
        bundle exec rails server -b 0.0.0.0 -p 3000
      "
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - storage:/app/storage
      - public_uploads:/app/public/uploads

  sidekiq:
    <<: *app
    command: bundle exec sidekiq -C config/sidekiq.yml
    volumes:
      - storage:/app/storage
      - public_uploads:/app/public/uploads

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: chatwoot_production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/chatwoot.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - public_uploads:/app/public/uploads:ro
    depends_on:
      - rails

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # Renueva automáticamente cada 12 horas
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done;'"

volumes:
  postgres_data:
  redis_data:
  storage:
  public_uploads:
