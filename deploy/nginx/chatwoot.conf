# Redirige HTTP → HTTPS y sirve el challenge de Let's Encrypt
server {
    listen 80;
    server_name chat.capitalplus.mx;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name chat.capitalplus.mx;

    ssl_certificate     /etc/letsencrypt/live/chat.capitalplus.mx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.capitalplus.mx/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Límite para adjuntos de WhatsApp (imágenes, videos, documentos)
    client_max_body_size 40m;

    # Resuelve "rails" contra el DNS interno de Docker en cada request (TTL 10s)
    # en vez de cachear la IP del contenedor para siempre. Así nginx no queda
    # apuntando a una IP vieja cuando `rails` se recrea en un deploy (evita 502).
    resolver 127.0.0.11 valid=10s;

    # Archivos públicos servidos directamente por nginx (más rápido)
    location /uploads/ {
        alias /app/public/uploads/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # WebSocket para ActionCable (tiempo real en Chatwoot)
    location /cable {
        set $rails_upstream rails:3000;
        proxy_pass         http://$rails_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
    }

    # Todo lo demás va a Rails
    location / {
        set $rails_upstream rails:3000;
        proxy_pass         http://$rails_upstream;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
