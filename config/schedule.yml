# https://github.com/ondrejbartas/sidekiq-cron
# use https://crontab.guru/ to validate
# validations for this file exist in /spec/configs/schedule_spec.rb

# DISABLED: this pings hub.2.chatwoot.com daily, which reports plan 'community'
# for this unlicensed self-hosted install. That overwrites
# InstallationConfig['INSTALLATION_PRICING_PLAN'] back to 'community' and triggers
# Internal::ReconcilePlanConfigService, which disables premium features
# (sla, custom_roles, audit_logs, disable_branding, captain_integration,
# csat_review_notes, conversation_required_attributes) on every account.
# executed daily at 0000 UTC
# schedules daily deferred jobs at stable times for each installation
# internal_check_new_versions_job:
#   cron: '0 0 * * *'
#   class: 'Internal::TriggerDailyScheduledItemsJob'
#   queue: scheduled_jobs
# # executed At every 5th minute..
trigger_scheduled_items_job:
  cron: '*/5 * * * *'
  class: 'TriggerScheduledItemsJob'
  queue: scheduled_jobs

# executed hourly for scheduled jobs that do not need minute-level cadence
trigger_hourly_scheduled_items_job:
  cron: '0 * * * *'
  class: 'Internal::TriggerHourlyScheduledItemsJob'
  queue: scheduled_jobs

# executed At every minute..
trigger_imap_email_inboxes_job:
  cron: '*/1 * * * *'
  class: 'Inboxes::FetchImapEmailInboxesJob'
  queue: scheduled_jobs

# executed daily at 2230 UTC
# which is our lowest traffic time
remove_stale_contact_inboxes_job.rb:
  cron: '30 22 * * *'
  class: 'Internal::RemoveStaleContactInboxesJob'
  queue: scheduled_jobs

# executed daily at 2230 UTC
# which is our lowest traffic time
remove_stale_redis_keys_job.rb:
  cron: '30 22 * * *'
  class: 'Internal::RemoveStaleRedisKeysJob'
  queue: scheduled_jobs

# DISABLED: investigating if this job is the source of orphan conversations
# #executed daily at 0430 UTC
# # which will be IST 10:00 AM
# process_stale_contacts_job:
#   cron: '30 04 * * *'
#   class: 'Internal::ProcessStaleContactsJob'
#   queue: housekeeping

# executed daily at 0100 UTC
# to delete accounts marked for deletion
delete_accounts_job:
  cron: '0 1 * * *'
  class: 'Internal::DeleteAccountsJob'
  queue: scheduled_jobs

# executed every 30 minutes for assignment_v2
periodic_assignment_job:
  cron: '*/30 * * * *'
  class: 'AutoAssignment::PeriodicAssignmentJob'
  queue: scheduled_jobs

# executed daily at 2230 UTC
# removes old notifications (>1 month) and trims to 300 per user
remove_old_notification_job:
  cron: '30 22 * * *'
  class: 'Notification::RemoveOldNotificationJob'
  queue: purgable

# executed every 12 hours
# to remove orphan conversations without contact
remove_orphan_conversations_job:
  cron: '0 */12 * * *'
  class: 'Internal::RemoveOrphanConversationsJob'
  queue: housekeeping

# executed every 30 minutes
# sends WhatsApp reactivation messages before Meta's 24h window closes
agent_bot_reactivation_job:
  cron: '*/30 * * * *'
  class: 'AgentBots::ReactivationJob'
  queue: scheduled_jobs

# executed every 30 minutes
# safety net that retries cadence steps/response-checks whose scheduled job was lost
cadences_watchdog_job:
  cron: '*/30 * * * *'
  class: 'Cadences::WatchdogJob'
  queue: scheduled_jobs

# executed hourly
# reactivates "cold" enrollments (exhausted all steps that existed at the time without a
# response) when a new step gets added to their cadence after the fact
cadences_cold_reactivation_job:
  cron: '0 * * * *'
  class: 'Cadences::ColdReactivationJob'
  queue: scheduled_jobs

# executed hourly
# cachea localmente la etapa del Deal de Zoho vinculado a cada contacto convertido, para que el
# reporte de embudo de ventas (V2::Reports::SalesFunnelBuilder) no dependa de consultar Zoho
# en vivo. Solo lectura sobre Zoho.
zoho_deals_sync_job:
  cron: '0 * * * *'
  class: 'Crm::Zoho::DealsSyncJob'
  queue: scheduled_jobs

# executed every monday at 0600 UTC
# genera el reporte semanal operativo (KPIs + análisis LLM) de la semana recién cerrada, por
# cada inbox con una cadencia activa
generate_weekly_ops_report_job:
  cron: '0 6 * * 1'
  class: 'Reports::GenerateWeeklyOpsReportJob'
  queue: scheduled_jobs

# executed daily at 2235 UTC
# removes raw WhatsApp webhook audit rows older than 30 days
remove_old_whatsapp_webhook_events_job:
  cron: '35 22 * * *'
  class: 'Internal::RemoveOldWhatsappWebhookEventsJob'
  queue: purgable

# executed daily at 0700 UTC
# compares Chatwoot's WhatsApp campaign delivery stats against Meta's template_analytics API
reconcile_meta_analytics_job:
  cron: '0 7 * * *'
  class: 'Campaigns::ReconcileMetaAnalyticsJob'
  queue: scheduled_jobs
